services:
  - type: web
    name: acme-policy-assistant
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python ingest.py
    startCommand: gunicorn app:app --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
